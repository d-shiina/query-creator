name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit

  # e2e（Playwright + Electron）はCIでは動かせないため、ジョブを置いていない。
  # 製品版はライセンスファイルが必須で、無い状態で起動するとウィンドウを
  # 開く前にモーダルを出して終了する。GitHubホストランナーにはライセンスを
  # 置けないので、firstWindow() が必ずタイムアウトする。
  # e2eはライセンスを配置した実機でのみ実行する（npm run test:e2e）。
